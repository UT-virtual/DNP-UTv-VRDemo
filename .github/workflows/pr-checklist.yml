name: PR Checklist

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  checklist:
    name: PR checklist complete
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify all checklist boxes are ticked
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$BODY" ]; then
            echo "::error::PR の本文が空です。PR テンプレートに沿って記入してください。"
            exit 1
          fi
          SECTION=$(printf '%s\n' "$BODY" | awk '/required-checks-start/{flag=1; next} /required-checks-end/{flag=0} flag')
          if [ -z "$SECTION" ]; then
            echo "::error::必須チェックの範囲が見つかりません。テンプレートの <!-- required-checks-start --> と <!-- required-checks-end --> を残してください。"
            exit 1
          fi
          UNCHECKED=$(printf '%s\n' "$SECTION" | grep -cE '^\s*-\s*\[\s*\]' || true)
          if [ "$UNCHECKED" -gt 0 ]; then
            echo "::error::必須チェックに未チェックの項目が $UNCHECKED 件あります。すべてにチェックを入れてからマージしてください。"
            echo "未チェックの項目:"
            printf '%s\n' "$SECTION" | grep -nE '^\s*-\s*\[\s*\]' || true
            exit 1
          fi
          echo "必須チェックはすべて完了しています。"
